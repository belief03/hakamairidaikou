name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [microcms]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require microCMS credentials
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          if [ -z "$MICROCMS_API_KEY" ]; then
            echo "MICROCMS_API_KEY is missing on this repository."
            exit 1
          fi
      - name: Build site from microCMS
        env:
          MICROCMS_SERVICE_DOMAIN: hakamorinotami
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run build
      - name: Keep the custom domain
        run: cp CNAME public/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
